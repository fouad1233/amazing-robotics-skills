[project]
name = "roboagents"
version = "0.1.0"
description = "Robotics domain-expert agents built on NVIDIA OO Agents, powered by the amazing-robotics-skills catalogue"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa>=0.0.8",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
roboagents = "roboagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboagents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PIE790: ruff considers a bare `...` after a docstring "unnecessary" and
# deletes it under --fix. In NOOA, a docstring-then-`...` body is not dead
# code -- it is what marks a method as agentic (the AgentMeta metaclass keys
# `needs_generation` off the literal Ellipsis). Deleting it silently turns the
# method into a no-op that returns None instead of ever calling the LLM, with
# no error at lint time, import time, or call time until something notices the
# result is None. This bit us for real on 2026-08-12: `ruff check --fix` on
# this package stripped the `...` from every agentic method it touched.
ignore = ["PIE790"]
